[project]
name = "yolov8-ppe-detection"
version = "1.0.0"
description = "Safety-gear detection with YOLOv8 (trained in CI) and a per-worker site-compliance engine served with ONNX Runtime."
authors = [{ name = "Vishavjit Singh Saini" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
